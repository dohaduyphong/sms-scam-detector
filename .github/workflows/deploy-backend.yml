name: Deploy Backend

on:
  push:
    branches:
      - main
    # Only backend changes restart the API; docs/ (GitHub Pages), README.md,
    # DEPLOY.md etc. don't. Use workflow_dispatch to deploy manually anyway.
    paths:
      - api.py
      - scam_detector/**
      - requirements.txt
      - models/**
      - deploy/**
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up SSH key and pinned host key
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key)
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # No remote command: the server's forced command for this key runs
      # /home/api_duyphong/bin/deploy-sms-scam-detector (-> deploy/update.sh).
      - name: Trigger deployment on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -T \
            -p "$VPS_PORT" \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" < /dev/null

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
